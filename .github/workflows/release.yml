name: Build and Release

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(grep -m1 'version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Get short commit SHA
        id: sha
        run: echo "SHA=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Get full commit message
        id: commit
        run: echo "MESSAGE=$(git log -1 --format='%s')" >> $GITHUB_OUTPUT

      - name: Configure signing
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          sed -i 's/\$STORE_PASSWORD/'"$STORE_PASSWORD"'/g' android/key.properties
          sed -i 's/\$KEY_PASSWORD/'"$KEY_PASSWORD"'/g' android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}-${{ steps.sha.outputs.SHA }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            **Commit:** ${{ steps.sha.outputs.SHA }}
            **Message:** ${{ steps.commit.outputs.MESSAGE }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}