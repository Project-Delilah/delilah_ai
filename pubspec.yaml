name: delilah
description: "Project Delilah - AI Image Generation & Virtual Try-On"
publish_to: 'none'

version: 1.0.8+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  dio: ^5.4.3
  http: ^1.2.1

  pocketbase: ^0.21.0

  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2
  gal: ^2.3.0

  image_picker: ^1.1.0

  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  better_player_plus: ^1.2.1
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path_android: "assets/android-flutter-icon-full.png"
  adaptive_icon_background: "assets/android-flutter-icon-background.png"
  adaptive_icon_foreground: "assets/android-flutter-icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - Screenshots/